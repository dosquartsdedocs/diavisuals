schema_version: 1
name: diavisuals
kind: codex-mcp-factory
version: 0.3.1
description: Workspace-confined diagram styles and hardened Docker rendering for Mermaid and PlantUML.
repository: https://github.com/dosquartsdedocs/diavisuals
workspace_rule:
  consumer_root: .
  source_paths:
    - "assets/**/*.{mmd,mermaid,puml,plantuml,uml}"
    - "_chapters/**/*.{mmd,mermaid,puml,plantuml,uml}"
    - "_documentation/**/*.{mmd,mermaid,puml,plantuml,uml}"
  generated_paths:
    - .cache/diavisuals
    - .unaltraweb/receipts/diavisuals.json
  init_creates:
    - .cache/diavisuals
  allowed_external_writes: []
runtime:
  kind: python
  package_manager: uv
  package: diavisuals[mcp]
  module: diavisuals
  mcp_version: 1.29.0
transport:
  type: stdio
  command: [make, -C, "${factoryRoot}", mcp-stdio, "PROJECT=${workspaceFolder}"]
commands:
  build: [make, mcp-build]
  init: [make, mcp-init, "PROJECT=${workspaceFolder}"]
  check: [make, mcp-check]
  tests: [make, tests]
  smoke: [make, mcp-smoke]
  down: [make, mcp-down, "PROJECT=${workspaceFolder}"]
  update: [bash, "${factoryRoot}/scripts/factory-launcher", "${factoryRoot}", update]
  release_status: [bash, "${factoryRoot}/scripts/factory-launcher", "${factoryRoot}", release-status]
  install_check: [bash, "${factoryRoot}/scripts/factory-launcher", "${factoryRoot}", install-check]
  factory_check: [bash, "${factoryRoot}/scripts/factory-launcher", "${factoryRoot}", factory-check]
  install_codex_mcp: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", install-codex-mcp]
  serve: [make, -C, "${factoryRoot}", mcp-stdio, "PROJECT=${workspaceFolder}"]
  manifest: [bash, "${factoryRoot}/scripts/factory-launcher", "${factoryRoot}", manifest]
  styles: [bash, "${factoryRoot}/scripts/factory-launcher", "${factoryRoot}", styles]
  audit: [bash, "${factoryRoot}/scripts/factory-launcher", "${factoryRoot}", audit]
  project_check: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", project-check]
  render: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", render]
  render_text: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", render-text]
discovery:
  file: mcp-factory.yml
  suggested_scan_roots: [~/git]
  checkout_required_for_make_lifecycle: true
release:
  default: v0.3.1
  compatibility: mermaid-11.16.0-plantuml-1.2026.1
  family: benizar
contracts:
  mcp_errors: typed-is-error-result
  consumer_root_fixed_at_startup: true
  container_consumer_mount: none
  renderer_staging: selected-input-and-style-assets-only
  project_check_roots: [assets, _chapters, _documentation]
  receipt: .unaltraweb/receipts/diavisuals.json
mcp:
  server_name: diavisuals
  transport: stdio
  consumer_root_fixed_at_startup: true
  required_tools:
    - style_inventory
    - style_audit
    - check_styles
    - compatibility_status
    - release_status
    - submodule_plan
    - project_check
    - render_diagram
    - render_diagram_text
    - update
    - factory_manifest
  resources:
    - diavisuals://agent-guide
    - diavisuals://styles
    - diavisuals://compatibility
    - diavisuals://style-audit
    - diavisuals://examples
    - diavisuals://project/check
    - diavisuals://factory-manifest
