schema_version: 1
name: diavisuals
kind: codex-mcp-factory
version: 0.3.0
description: Workspace-confined diagram styles and hardened Docker rendering for Mermaid and PlantUML.
repository: https://github.com/dosquartsdedocs/diavisuals
workspace_rule:
  consumer_root: .
  source_paths: []
  generated_paths:
    - .cache/diavisuals
  init_creates:
    - .cache/diavisuals
  allowed_external_writes: []
runtime:
  kind: python
  package_manager: uv
  package: diavisuals[mcp]
  module: diavisuals
  mcp_version: 1.29.0
transport:
  type: stdio
  command: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", serve]
commands:
  build: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", build]
  init: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", init]
  check: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", check]
  tests: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", tests]
  smoke: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", smoke]
  down: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", down]
  update: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", update]
  release_status: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", release-status]
  install_check: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", install-check]
  factory_check: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", factory-check]
  install_codex_mcp: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", install-codex-mcp]
  serve: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", serve]
  client_config: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", client-config]
  manifest: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", manifest]
  styles: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", styles]
  audit: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", audit]
  render: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", render]
  render_text: [bash, "${factoryRoot}/scripts/factory-launcher", "${workspaceFolder}", render-text]
discovery:
  file: mcp-factory.yml
  suggested_scan_roots: [~/git]
  checkout_required_for_make_lifecycle: true
release:
  default: v0.3.0
  compatibility: mermaid-11.16.0-plantuml-1.2026.1
  family: benizar
contracts:
  mcp_errors: typed-is-error-result
  consumer_root_fixed_at_startup: true
  container_consumer_mount: none
  renderer_staging: selected-input-and-style-assets-only
mcp:
  server_name: diavisuals
  transport: stdio
  consumer_root_fixed_at_startup: true
  required_tools:
    - style_inventory
    - style_audit
    - check_styles
    - compatibility_status
    - release_status
    - submodule_plan
    - render_diagram
    - render_diagram_text
    - update
    - factory_manifest
  resources:
    - diavisuals://agent-guide
    - diavisuals://styles
    - diavisuals://compatibility
    - diavisuals://style-audit
    - diavisuals://examples
    - diavisuals://factory-manifest
