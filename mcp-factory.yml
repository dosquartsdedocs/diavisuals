---
name: diavisuals
kind: codex-mcp-factory
version: 0.1.2
description: Shared diagram style registry and Docker renderer for Mermaid and PlantUML.
workspace_rule:
  consumer_root: .
  source_paths: []
  generated_paths:
    - .cache/diavisuals
  init_creates:
    - .cache/diavisuals
  allowed_external_writes: []
runtime:
  kind: python
  package_manager: pip
  package: diavisuals
  module: diavisuals
transport:
  type: stdio
  command:
    - make
    - -C
    - '${factoryRoot}'
    - mcp-stdio
    - 'PROJECT=${workspaceFolder}'
commands:
  build:
    - make
    - mcp-build
  init:
    - make
    - mcp-init
  check:
    - make
    - mcp-check
  smoke:
    - make
    - mcp-smoke
  down:
    - make
    - mcp-down
  update:
    - diavisuals
    - update
  install_codex_mcp:
    - diavisuals
    - install-codex-mcp
  client_config:
    - diavisuals
    - mcp
    - client-config
  serve:
    - make
    - mcp-stdio
  manifest:
    - diavisuals
    - factory-manifest
  styles:
    - diavisuals
    - style-inventory
  audit:
    - diavisuals
    - style-audit
  render:
    - diavisuals
    - render-diagram
  render_text:
    - diavisuals
    - render-diagram-text
discovery:
  suggested_scan_roots:
    - ~/git
  notes:
    - ContExt can scan sibling Git repositories for mcp-factory.yml.
    - Consumers should declare this factory as an MCP dependency instead of copying Mermaid or PlantUML render engines.
mcp:
  server_name: diavisuals
  transport: stdio
  resources:
    - diavisuals://agent-guide
    - diavisuals://styles
    - diavisuals://compatibility
    - diavisuals://style-audit
    - diavisuals://examples
    - diavisuals://factory-manifest
  required_tools:
    - style_inventory
    - style_audit
    - check_styles
    - compatibility_status
    - release_status
    - submodule_plan
    - render_diagram
    - render_diagram_text
    - update
release:
  default: v0.1.2
  compatibility: mermaid-11.4.2-plantuml-1.2026.1
  family: benizar
---
