name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.1
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp
      - run: make lint tests
      - if: matrix.python-version != '3.10'
        run: make tests-mcp

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.1
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp
      - run: make tests-install

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DIAVISUALS_PREVIOUS_PYTHON: ${{ github.workspace }}/.tmp/previous-0.5.0/bin/python
      DIAVISUALS_PREVIOUS_WHEEL: ${{ github.workspace }}/.tmp/previous-assets/diavisuals-0.5.0-py3-none-any.whl
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.1
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp
      - run: docker info
      - name: Prepare the actual previous published control plane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" \
            --pattern diavisuals-0.5.0-py3-none-any.whl --dir .tmp/previous-assets
          printf '%s  %s\n' f52e20f20f1fb3a2418f07adb8d6a68a5567d0c321fb7c0ccc0f4db04917b96b \
            "$DIAVISUALS_PREVIOUS_WHEEL" | sha256sum --check
          uv venv --python 3.12 .tmp/previous-0.5.0
          uv pip install --python "$DIAVISUALS_PREVIOUS_PYTHON" "$DIAVISUALS_PREVIOUS_WHEEL[mcp]"
      - name: Prepare the unchanged historical renderer for rollback proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.4.0 --repo "$GITHUB_REPOSITORY" \
            --pattern diavisuals-render-v0.3.0-linux-amd64.tar.gz --dir .tmp/published-renderer
          printf '%s  %s\n' de5d98d6bcff2f427e2ce83db6e7a14edaf6963d199483cb68674ab43d3d75e4 \
            .tmp/published-renderer/diavisuals-render-v0.3.0-linux-amd64.tar.gz | sha256sum --check
          docker image load --input .tmp/published-renderer/diavisuals-render-v0.3.0-linux-amd64.tar.gz
          test "$(docker image inspect diavisuals/render:v0.3.0 --format '{{.Id}}')" = \
            sha256:5a6887b372a0e1c386a7b54981d11ae1910215baeb6a12dfd0706b3e85ef0846
      - name: Prepare the new renderer
        run: make mcp-build
      - name: Require a clean audit and prove the installed renderer matches its lock
        run: |
          set -euo pipefail
          audit_exit=0
          npm audit --omit=dev --json --prefix docker/current > .tmp/npm-audit.json || audit_exit=$?
          .venv/bin/python tools/check-current-renderer-audit.py .tmp/npm-audit.json \
            --audit-exit-code "$audit_exit" \
            --image-id "$(docker image inspect diavisuals/render:v0.7.0 --format '{{.Id}}')" > .tmp/renderer-proof.json
      - name: Retain the exact renderer audit for owner review
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: renderer-audit
          path: |
            .tmp/npm-audit.json
            .tmp/renderer-proof.json
      - run: make docker-test
      - name: Prove runtime smoke and W1 from both non-editable distributions
        run: DIAVISUALS_DOCKER_SMOKE=1 DIAVISUALS_W1_DOCKER=1 DIAVISUALS_W1_EVIDENCE="$RUNNER_TEMP/w1-evidence" make tests-install
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: w1-installed-evidence
          path: ${{ runner.temp }}/w1-evidence
      - run: DIAVISUALS_MCP_SMOKE=1 .venv/bin/python -m unittest tests.test_registry.RegistryTest.test_plantuml_renderer_blocks_workspace_includes_when_enabled
      - run: make render-gallery
      - run: git diff --exit-code -- docs/gallery
      - run: test -z "$(git status --porcelain --untracked-files=all -- docs/gallery)"

  published-d0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIAVISUALS_D0_06_PYTHON: ${{ github.workspace }}/.tmp/d0-06/bin/python
      DIAVISUALS_D0_06_WHEEL: ${{ github.workspace }}/.tmp/d0-assets/06/diavisuals-0.6.0-py3-none-any.whl
      DIAVISUALS_D0_07_PYTHON: ${{ github.workspace }}/.tmp/d0-07/bin/python
      DIAVISUALS_D0_07_WHEEL: ${{ github.workspace }}/.tmp/d0-assets/07/diavisuals-0.7.0-py3-none-any.whl
      DIAVISUALS_D0_PUBLISHED_EVIDENCE: ${{ runner.temp }}/published-d0-evidence
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.1
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp
      - name: Prepare the two immutable published points on this isolated runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.6.0 --repo "$GITHUB_REPOSITORY" --dir .tmp/d0-assets/06 \
            --pattern diavisuals-0.6.0-py3-none-any.whl --pattern diavisuals-render-v0.3.0-linux-amd64.tar.gz
          gh release download v0.7.0 --repo "$GITHUB_REPOSITORY" --dir .tmp/d0-assets/07 \
            --pattern diavisuals-0.7.0-py3-none-any.whl --pattern diavisuals-render-v0.7.0-linux-amd64.tar.gz
          printf '%s  %s\n' d7cc225340c65879e4a9e831d52b8fd13d7da5b7696d7430a88f16ca88035fb6 "$DIAVISUALS_D0_06_WHEEL" | sha256sum --check
          printf '%s  %s\n' 8534e9f7584242458919b6d3ba1ff0e2d2f7910259939a841854e0892c62c705 "$DIAVISUALS_D0_07_WHEEL" | sha256sum --check
          printf '%s  %s\n' de5d98d6bcff2f427e2ce83db6e7a14edaf6963d199483cb68674ab43d3d75e4 .tmp/d0-assets/06/diavisuals-render-v0.3.0-linux-amd64.tar.gz | sha256sum --check
          printf '%s  %s\n' 399e46a56865d7019cd1c8d91edba97c9cb1faeb26b5b84b8050796fec44fa3f .tmp/d0-assets/07/diavisuals-render-v0.7.0-linux-amd64.tar.gz | sha256sum --check
          # There is no candidate renderer build in this job and no alias remap.
          docker image load --input .tmp/d0-assets/06/diavisuals-render-v0.3.0-linux-amd64.tar.gz
          docker image load --input .tmp/d0-assets/07/diavisuals-render-v0.7.0-linux-amd64.tar.gz
          uv venv --python 3.12 .tmp/d0-06
          uv venv --python 3.12 .tmp/d0-07
          uv pip install --python "$DIAVISUALS_D0_06_PYTHON" "$DIAVISUALS_D0_06_WHEEL[mcp]"
          uv pip install --python "$DIAVISUALS_D0_07_PYTHON" "$DIAVISUALS_D0_07_WHEEL[mcp]"
      - id: published_pair
        run: make tests-d0-published
      - name: Summarize the qualified points for reviewers
        if: always()
        run: |
          {
            printf '## Published D0 compatibility\n\n'
            printf 'Gate result: **%s**\n\n' '${{ steps.published_pair.outcome }}'
            printf '| Point | Renderer |\n| --- | --- |\n'
            printf '| Published 0.6.0 | Immutable v0.3.0 image |\n'
            printf '| Published 0.7.0 | Immutable v0.7.0 image |\n\n'
            printf 'The gate checks live identity, reconnect, A/B/A, mixed-version busy release, author-data preservation and explicit-runtime refusal.\n\n'
            printf 'Detailed observations: **published-d0-pair** artifact. This is an explicit acceptance gate, separate from the minimal factory smoke; it does not infer a version range or shared-runtime adoption.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: published-d0-pair
          path: ${{ runner.temp }}/published-d0-evidence
