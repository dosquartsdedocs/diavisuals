name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.5
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp
      - run: make lint tests
      - if: matrix.python-version == '3.12'
        run: make tests-mcp

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.5
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp
      - run: make tests-install

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.5
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp
      - run: npm audit --omit=dev --prefix docker
      - run: docker info
      - run: make docker-test
      - run: DIAVISUALS_MCP_SMOKE=1 .venv/bin/python -m unittest tests.test_registry.RegistryTest.test_plantuml_renderer_blocks_workspace_includes_when_enabled
      - run: make render-gallery
      - run: git diff --exit-code -- docs/gallery
      - run: test -z "$(git status --porcelain --untracked-files=all -- docs/gallery)"
