name: Verify published release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        default: v0.7.0
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  published-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      DISTRIBUTION: ${{ matrix.distribution }}
      DIAVISUALS_PREVIOUS_PYTHON: ${{ github.workspace }}/.tmp/previous-0.5.0/bin/python
      DIAVISUALS_PREVIOUS_WHEEL: ${{ github.workspace }}/.tmp/previous-assets/diavisuals-0.5.0-py3-none-any.whl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.5
          python-version: '3.12'
      - name: Download and verify public assets
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .tmp/release-assets
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.tmp/release-assets')
          release = json.loads((root / 'release.json').read_text())
          assert release['tag'] == os.environ['RELEASE_TAG']
          assert release['version'] == os.environ['RELEASE_TAG'][1:]
          assert release['commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for item in release['artifacts']:
              name = item['name']
              assert pathlib.PurePosixPath(name).name == name and name not in {'.', '..'}
              path = root / name
              assert path.is_file() and not path.is_symlink() and path.stat().st_size == item['bytes']
              sha = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      sha.update(chunk)
              assert sha.hexdigest() == item['sha256'], name
          PY
      - name: Verify complete checksum inventory
        working-directory: .tmp/release-assets
        run: sha256sum --check SHA256SUMS
      - name: Load the released renderer and install the released distribution
        run: |
          set -euo pipefail
          docker image load --input .tmp/release-assets/diavisuals-render-v0.3.0-linux-amd64.tar.gz
          uv venv .tmp/release-venv
          if [ "$DISTRIBUTION" = wheel ]; then suffix=py3-none-any.whl; else suffix=tar.gz; fi
          if [ "$DISTRIBUTION" = wheel ]; then separator=-; else separator=.; fi
          uv pip install --python .tmp/release-venv/bin/python ".tmp/release-assets/diavisuals-${RELEASE_TAG#v}${separator}${suffix}[mcp]"
          .tmp/release-venv/bin/python - <<'PY'
          import json, pathlib, subprocess
          from diavisuals import __version__, artifacts, registry
          release = json.loads(pathlib.Path('.tmp/release-assets/release.json').read_text())
          assert registry.source_checkout() is None
          assert __version__ == release['version']
          assert artifacts._producer_snapshot()[0]['revision'] == release['producer_source_revision']
          runtime = release['runtime']
          actual = subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', runtime['image']], text=True).strip()
          assert actual == runtime['image_id']
          assert registry.factory_manifest()['contracts']['artifact_handoff'] == release['artifact_handoff']
          assert registry.factory_manifest()['contracts']['renderer_selection'] == release['runtime_selection']
          assert (registry.factory_metadata_root() / 'mcp-factory.yml').read_bytes() == pathlib.Path('.tmp/release-assets/mcp-factory-package.yml').read_bytes()
          acceptance = json.loads(pathlib.Path('.tmp/release-assets/acceptance.json').read_text())
          assert acceptance['commit'] == release['commit'] and acceptance['version'] == release['version']
          assert set(release['required_tools']) <= set(registry.MCP_TOOL_NAMES)
          PY
          .tmp/release-venv/bin/diavisuals factory-check
          .tmp/release-venv/bin/diavisuals mcp-smoke
          .tmp/release-venv/bin/diavisuals --runtime-image sha256:5a6887b372a0e1c386a7b54981d11ae1910215baeb6a12dfd0706b3e85ef0846 renderer-status
      - name: Exercise the installed producer against the published runtime
        env:
          DIAVISUALS_INSTALLED: '1'
          DIAVISUALS_DOCKER_SMOKE: '1'
          DIAVISUALS_MCP_SMOKE: '1'
        run: .tmp/release-venv/bin/python -m unittest tests.test_artifacts tests.test_artifacts_runtime tests.test_runtime_selection tests.test_runtime_selection_docker tests.test_session tests.test_session_mcp
      - name: Prepare the real 0.5.0 rollback point
        run: |
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" \
            --pattern diavisuals-0.5.0-py3-none-any.whl --dir .tmp/previous-assets
          printf '%s  %s\n' f52e20f20f1fb3a2418f07adb8d6a68a5567d0c321fb7c0ccc0f4db04917b96b \
            "$DIAVISUALS_PREVIOUS_WHEEL" | sha256sum --check
          uv venv --python 3.12 .tmp/previous-0.5.0
          uv pip install --python "$DIAVISUALS_PREVIOUS_PYTHON" "$DIAVISUALS_PREVIOUS_WHEEL[mcp]"
      - name: Prove live offline identity and scoped lifecycle
        env:
          DIAVISUALS_INSTALLED: '1'
          DIAVISUALS_DOCKER_SMOKE: '1'
          DIAVISUALS_D0_EVIDENCE: ${{ runner.temp }}/d0-evidence
        run: .tmp/release-venv/bin/python -m unittest tests.test_d0_acceptance
      - name: Prove installed W1 companion, volumes, delivery and lifecycle
        env:
          DIAVISUALS_INSTALLED: '1'
          DIAVISUALS_W1_DOCKER: '1'
          DIAVISUALS_W1_EVIDENCE: ${{ runner.temp }}/w1-evidence
        run: |
          .tmp/release-venv/bin/python -m unittest tests.test_job_storage tests.test_job_storage_docker
          .tmp/release-venv/bin/python -c 'from pathlib import Path; from diavisuals import registry; assert (registry.factory_metadata_root()/"mcp-job-storage.json").read_bytes() == Path(".tmp/release-assets/mcp-job-storage.json").read_bytes()'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-${{ matrix.distribution }}
          path: ${{ runner.temp }}/w1-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d0-${{ matrix.distribution }}
          path: ${{ runner.temp }}/d0-evidence
