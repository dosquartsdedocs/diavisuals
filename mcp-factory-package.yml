schema_version: 1
name: diavisuals
kind: codex-mcp-factory
install_scope: user
version: 0.4.0
description: Workspace-confined diagram styles and hardened Docker rendering for Mermaid and PlantUML.
repository: https://github.com/dosquartsdedocs/diavisuals
workspace_rule:
  binding: consumer
  consumer_root: .
  source_paths:
    - "assets/**/*.{mmd,mermaid,puml,plantuml,uml}"
    - "_chapters/**/*.{mmd,mermaid,puml,plantuml,uml}"
    - "_documentation/**/*.{mmd,mermaid,puml,plantuml,uml}"
  generated_paths:
    - .cache/diavisuals
    - .unaltraweb/receipts/diavisuals.json
    - .diavisuals/artifacts
  init_creates:
    - .cache/diavisuals
  path_policies:
    - path: .cache/diavisuals
      type: directory
      role: diagram-render-cache
      git: ignored
      cleanup: disposable
    - path: .unaltraweb/receipts/diavisuals.json
      type: file
      role: diagram-validation-receipt
      git: consumer
      cleanup: explicit
    - path: .diavisuals/artifacts
      type: directory
      role: diagram-artifact-bundles-and-recovery
      git: consumer
      cleanup: explicit
  allowed_external_writes: []
runtime:
  kind: python
  package_manager: uv
  package: diavisuals[mcp]
  module: diavisuals
  mcp_version: 1.29.0
transport:
  type: stdio
  command: [diavisuals, mcp, serve]
  env:
    MCP_CONSUMER_WORKSPACE: "${workspaceFolder}"
commands:
  build: [diavisuals, ensure-renderer]
  init: [diavisuals, --project, "${workspaceFolder}", init]
  check: [diavisuals, lifecycle-check]
  tests: [diavisuals, self-test]
  smoke: [diavisuals, mcp-smoke]
  down: [diavisuals, --project, "${workspaceFolder}", down]
  update: [diavisuals, update]
  release_status: [diavisuals, release-status]
  install_check: [diavisuals, install-check]
  factory_check: [diavisuals, factory-check]
  install_codex_mcp: [diavisuals, --project, "${workspaceFolder}", install-codex-mcp]
  serve: [diavisuals, --project, "${workspaceFolder}", mcp, serve]
  manifest: [diavisuals, factory-manifest]
  styles: [diavisuals, style-inventory]
  audit: [diavisuals, style-audit]
  project_check: [diavisuals, --project, "${workspaceFolder}", project-check]
  render: [diavisuals, --project, "${workspaceFolder}", render-diagram]
  render_text: [diavisuals, --project, "${workspaceFolder}", render-diagram-text]
  export_bundle: [diavisuals, --project, "${workspaceFolder}", export-diagram-bundle]
discovery:
  file: mcp-factory.yml
  suggested_scan_roots: [~/git]
  checkout_required_for_make_lifecycle: false
release:
  default: v0.4.0
  compatibility: mermaid-11.16.0-plantuml-1.2026.1
  family: benizar
contracts:
  mcp_errors: typed-is-error-result
  consumer_root_fixed_at_startup: true
  container_consumer_mount: none
  renderer_staging: selected-input-and-style-assets-only
  project_check_roots: [assets, _chapters, _documentation]
  receipt: .unaltraweb/receipts/diavisuals.json
  artifact_handoff: v1-opt-in-leaf-diagram
mcp:
  server_name: diavisuals
  transport: stdio
  consumer_root_fixed_at_startup: true
  required_tools:
    - style_inventory
    - style_audit
    - check_styles
    - compatibility_status
    - release_status
    - submodule_plan
    - project_check
    - render_diagram
    - render_diagram_text
    - initialize_artifact_export
    - export_diagram_bundle
    - check_diagram_bundle
    - recover_diagram_bundle
    - update
    - factory_manifest
  resources:
    - diavisuals://agent-guide
    - diavisuals://styles
    - diavisuals://compatibility
    - diavisuals://style-audit
    - diavisuals://examples
    - diavisuals://project/check
    - diavisuals://factory-manifest
