skinparam SequenceParticipantBackgroundColor #ECF4FF
skinparam SequenceBoxBorderColor #6F9DCE
skinparam SequenceBoxBackgroundColor #F2F7FD
skinparam SequenceCollectionBorderColor #2A5DB0
skinparam SequenceCollectionBackgroundColor #ECF4FF
skinparam SequenceCollectionFontColor #0F223A
skinparam CollectionsBorderColor #2A5DB0
