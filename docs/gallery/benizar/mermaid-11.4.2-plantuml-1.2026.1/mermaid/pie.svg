<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 676.390625 450" style="max-width: 676.391px; background-color: white;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:Latin Modern Sans,DejaVu Sans,Arial,sans-serif;font-size:18px;fill:#0F223A;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#F5FAFF;}#my-svg .error-text{fill:#0a0500;stroke:#0a0500;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#2A5DB0;stroke:#2A5DB0;}#my-svg .marker.cross{stroke:#2A5DB0;}#my-svg svg{font-family:Latin Modern Sans,DejaVu Sans,Arial,sans-serif;font-size:18px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#FFFFFF;font-family:Latin Modern Sans,DejaVu Sans,Arial,sans-serif;}#my-svg .slice{font-family:Latin Modern Sans,DejaVu Sans,Arial,sans-serif;fill:#0F223A;font-size:17px;}#my-svg .legend text{fill:#FFFFFF;font-family:Latin Modern Sans,DejaVu Sans,Arial,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#2A5DB0;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#2A5DB0;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg .pieTitleText{font-weight:700!important;fill:rgb(15, 34, 58)!important;}#my-svg .slice{stroke:rgb(255, 255, 255)!important;stroke-width:2px!important;}#my-svg .legend text{fill:rgb(15, 34, 58)!important;}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,185,0L0,0Z" fill="#DCEAF8" class="pieCircle"/><path d="M185,0A185,185,0,0,1,-108.74,149.668L0,0Z" fill="#EAF3FF" class="pieCircle"/><path d="M-108.74,149.668A185,185,0,0,1,-108.74,-149.668L0,0Z" fill="#F5FAFF" class="pieCircle"/><path d="M-108.74,-149.668A185,185,0,0,1,0,-185L0,0Z" fill="hsl(210, 66.6666666667%, 81.7647058824%)" class="pieCircle"/><text transform="translate(81.10514780209701,-81.105147802097)" class="slice" style="text-anchor: middle;">25%</text><text transform="translate(52.07271032012602,102.19844832440579)" class="slice" style="text-anchor: middle;">35%</text><text transform="translate(-114.7,1.4046698786220142e-14)" class="slice" style="text-anchor: middle;">30%</text><text transform="translate(-35.444249254806486,-109.08618241905411)" class="slice" style="text-anchor: middle;">10%</text><text x="0" y="-200" class="pieTitleText">Style effort</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(220, 234, 248); stroke: rgb(220, 234, 248);"/><text x="22" y="14">Base tokens</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(234, 243, 255); stroke: rgb(234, 243, 255);"/><text x="22" y="14">Mermaid overrides</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(245, 250, 255); stroke: rgb(245, 250, 255);"/><text x="22" y="14">PlantUML overrides</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(178, 209, 240); stroke: rgb(178, 209, 240);"/><text x="22" y="14">Docs</text></g></g></svg>